# fdroidserver 設定：只做二進位套件庫（APK 來自 gordonpow/PiliBTRTV 的 GitHub Releases）
repo_url: https://gordonpow.github.io/fdroid/repo
repo_name: PiliBTRTV
repo_description: >-
  PiliBTRTV（Android TV 第三方 B站用戶端）的 F-Droid 套件庫，與 GitHub Releases 同步。
  F-Droid repository for PiliBTRTV, an unofficial Bilibili client for Android TV.
repo_keyalias: repokey
keystore: keystore.p12
keystorepass: {env: FDROID_KEYSTORE_PASS}
keypass: {env: FDROID_KEYSTORE_PASS}
archive_older: 0
